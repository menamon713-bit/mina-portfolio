<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090909">
  <title>M.A.S.H CYVEX | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    .container {
      width: min(1050px, 92%);
      margin: 45px auto;
    }

    .brand {
      color: #ff3030;
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
    }

    .panel, .message {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 13px;
      padding: 22px;
      margin-bottom: 18px;
    }

    h1, h2 {
      margin-top: 0;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #383838;
      background: #0c0c0c;
      color: white;
      margin: 10px 0;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff3030;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #e52b2b;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button.secondary {
      background: #292929;
    }

    .hidden {
      display: none !important;
    }

    .status {
      color: #aaa;
      margin-top: 14px;
      line-height: 1.7;
    }

    .error {
      color: #ff6262;
    }

    .success {
      color: #62d994;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .message h3 {
      margin: 0 0 12px;
      overflow-wrap: anywhere;
    }

    .message p {
      color: #ccc;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .meta {
      color: #999;
      font-size: 13px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .message-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 15px;
    }

    .message-actions select {
      margin: 0;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 35px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .panel, .message {
        padding: 16px;
      }

      .message-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">M.A.S.H CYVEX</div>
    <div class="subtitle">Secure Administration Panel</div>

    <section id="loginPanel" class="panel">
      <h2>تسجيل دخول الإدارة</h2>

      <form id="loginForm">
        <label for="password">كلمة مرور الإدارة</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="512"
          placeholder="أدخل كلمة المرور"
        >

        <button id="loginButton" type="submit">
          تسجيل الدخول
        </button>
      </form>

      <div id="loginStatus" class="status" role="status"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="topbar">
        <div>
          <h2>رسائل التواصل</h2>
          <div class="meta">آخر 100 رسالة</div>
        </div>

        <div>
          <button id="refreshButton" class="secondary">
            تحديث
          </button>

          <button id="logoutButton">
            تسجيل الخروج
          </button>
        </div>
      </div>

      <div id="dashboardStatus" class="status" role="status"></div>
      <div id="messages"></div>
    </section>
  </main>

  <script>
    "use strict";

    const loginPanel = document.getElementById("loginPanel");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const loginStatus = document.getElementById("loginStatus");
    const dashboardStatus = document.getElementById("dashboardStatus");
    const messagesContainer = document.getElementById("messages");

    const statusLabels = {
      new: "جديدة",
      read: "تمت قراءتها",
      replied: "تم الرد",
      archived: "مؤرشفة"
    };

    async function api(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
        ...options,
        headers: {
          "Accept": "application/json",
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });

      let data = {};

      try {
        data = await response.json();
      } catch (_) {}

      if (!response.ok) {
        throw new Error(
          response.status === 401
            ? "انتهت الجلسة أو يلزم تسجيل الدخول."
            : data.error || "حدث خطأ في الاتصال."
        );
      }

      return data;
    }

    function showStatus(element, message, type = "") {
      element.textContent = message;
      element.className = "status " + type;
    }

    function showDashboard() {
      loginPanel.classList.add("hidden");
      dashboard.classList.remove("hidden");
    }

    function showLogin() {
      dashboard.classList.add("hidden");
      loginPanel.classList.remove("hidden");
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;

      return element;
    }

    function formatDate(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value || "");
      }

      return date.toLocaleString("ar-EG");
    }

    function createMessageCard(message) {
      const card = createElement("article", "message");

      card.appendChild(
        createElement("h3", "", message.subject || "بدون عنوان")
      );

      const meta = createElement("div", "meta");

      meta.textContent =
        "رقم الرسالة: " + message.id +
        " | الاسم: " + message.name +
        " | البريد: " + message.email +
        " | التاريخ: " + formatDate(message.created_at);

      card.appendChild(meta);

      card.appendChild(
        createElement("p", "", message.message)
      );

      const actions = createElement("div", "message-actions");

      const select = document.createElement("select");
      select.setAttribute("aria-label", "حالة الرسالة");

      Object.entries(statusLabels).forEach(([value, label]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        option.selected = message.status === value;
        select.appendChild(option);
      });

      const saveButton = createElement("button", "", "حفظ الحالة");

      saveButton.addEventListener("click", async () => {
        saveButton.disabled = true;

        try {
          await api("/api/admin/update-status", {
            method: "POST",
            body: JSON.stringify({
              id: message.id,
              status: select.value
            })
          });

          message.status = select.value;

          showStatus(
            dashboardStatus,
            "تم تحديث حالة الرسالة رقم " + message.id,
            "success"
          );
        } catch (error) {
          showStatus(dashboardStatus, error.message, "error");

          if (error.message.includes("انتهت الجلسة")) {
            showLogin();
          }
        } finally {
          saveButton.disabled = false;
        }
      });

      actions.appendChild(select);
      actions.appendChild(saveButton);
      card.appendChild(actions);

      return card;
    }

    async function loadMessages() {
      showStatus(dashboardStatus, "جارٍ تحميل الرسائل...");
      messagesContainer.replaceChildren();

      try {
        const data = await api("/api/admin/messages");

        if (!Array.isArray(data.messages) || data.messages.length === 0) {
          messagesContainer.appendChild(
            createElement("div", "panel empty", "لا توجد رسائل حتى الآن.")
          );

          showStatus(dashboardStatus, "");
          return;
        }

        const fragment = document.createDocumentFragment();

        data.messages.forEach(message => {
          fragment.appendChild(createMessageCard(message));
        });

        messagesContainer.appendChild(fragment);

        showStatus(
          dashboardStatus,
          "عدد الرسائل المعروضة: " + data.messages.length,
          "success"
        );

      } catch (error) {
        showStatus(dashboardStatus, error.message, "error");

        if (error.message.includes("انتهت الجلسة")) {
          showLogin();
        }
      }
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (!passwordInput.value) return;

      loginButton.disabled = true;
      showStatus(loginStatus, "جارٍ التحقق...");

      try {
        await api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({
            password: passwordInput.value
          })
        });

        passwordInput.value = "";
        showDashboard();
        await loadMessages();

      } catch (error) {
        showStatus(loginStatus, error.message, "error");
      } finally {
        loginButton.disabled = false;
      }
    });

    document.getElementById("refreshButton")
      .addEventListener("click", loadMessages);

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        try {
          await api("/api/admin/logout", {
            method: "POST",
            body: JSON.stringify({})
          });
        } catch (_) {}

        showLogin();
        messagesContainer.replaceChildren();
        showStatus(loginStatus, "تم تسجيل الخروج.", "success");
      });

    async function checkSession() {
      try {
        await api("/api/admin/session");
        showDashboard();
        await loadMessages();
      } catch (_) {
        showLogin();
      }
    }

    checkSession();
  </script>
</body>
</html>
