<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">  <title>M.A.S.H CYVEX | Admin Login</title>  <meta name="description" content="M.A.S.H CYVEX Secure Administration Portal">
  <meta name="robots" content="noindex, nofollow">  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">  <link rel="stylesheet" href="admin.css?v=3">  <script src="admin.js?v=3" defer></script></head><body>  <main class="login-screen" id="loginScreen"><section class="login-card">

  <div class="brand">
    <div class="brand-mark">M</div>

    <h1>M.A.S.H <span>CYVEX</span></h1>

    <p>SECURE ADMINISTRATION PORTAL</p>
  </div>

  <div class="login-divider"></div>

  <div class="login-heading">
    <h2>تسجيل دخول الإدارة</h2>
    <p>أدخل كلمة مرور الإدارة للوصول إلى لوحة التحكم.</p>
  </div>

  <form id="loginForm" autocomplete="on">

    <label for="adminPassword">
      كلمة مرور الإدارة
    </label>

    <div class="password-wrapper">

      <input
        type="password"
        id="adminPassword"
        name="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
        minlength="1"
      >

    </div>

    <div
      id="loginError"
      class="login-error hidden"
      role="alert"
      aria-live="polite"
    ></div>

    <button
      class="primary-btn"
      id="loginButton"
      type="submit"
    >
      تسجيل الدخول
      <span aria-hidden="true">←</span>
    </button>

  </form>

  <div class="login-footer">
    <span class="security-dot"></span>
    <span>SECURE CONNECTION</span>
  </div>

  <p class="copyright">
    © <span id="currentYear"></span> M.A.S.H CYVEX
  </p>

</section>

  </main> 
 
  </body>
  
</html>
